---
# Version management for development tools
# Override these in your own vars file or via command line

# Versions are on the top as they are most likely to be changed
lazygit_version: "0.63.0"
neovim_version: "0.12.4"
netbird_version: "0.74.2"
go_version: "1.26.5"
rust_version: "1.97.0"
nodejs_version: "24"
php_version: "8.5"
php_version_short: "8.5"
composer_version: "2"
python_version: "3.14"
nvm_version: "0.40.5"
codex_version: "0.143.0"
herdr_version: "0.7.5"
marksman_version: "2026-02-08"
eza_version: "0.23.4"
zsh_autosuggestions_version: "0.7.1"
zsh_syntax_highlighting_version: "0.8.0"
gh_version: "2.96.0"
terraform_version: "1.15.7"
terraform_checksums:
  linux_amd64: "73bbb8f5188ad75d4fb853fd100ae4d7e146ef7af7db18776109642fdb7759d2"
  linux_arm64: "7a9e92105ede978cf9049a2fbe53dfe67c6a8da4b4d7f613d89e7dd7c63ec40d"
packer_version: "1.15.4"
packer_checksums:
  linux_amd64: "15f97a6a99645c7d5308c609973b5280837b38e112beac413ccbce80da927cf1"
  linux_arm64: "23e6d2e596dd9e2527e0f7bea9aedd26059729375a0d17c462c2621f1b97b82d"

# Platform detection
is_macos: "{{ ansible_os_family == 'Darwin' }}"
is_linux: "{{ ansible_os_family == 'Debian' }}"

# Architecture mapping
# Maps ansible_architecture to common architecture names used in downloads
arch_map:
  x86_64: "amd64"
  aarch64: "arm64"
  arm64: "arm64" # macOS reports as 'arm64' for Apple Silicon
  armv7l: "armv7"

# macOS-specific paths
homebrew_prefix_intel: "/usr/local"
homebrew_prefix_silicon: "/opt/homebrew"
homebrew_prefix: "{{ homebrew_prefix_silicon if ansible_machine == 'arm64' else homebrew_prefix_intel }}"

# Go settings
go_arch: "{{ arch_map[ansible_architecture] | default('amd64') }}"
go_install_dir: "/usr/local"

# Neovim
neovim_config_dir: "{{ ansible_env.HOME }}/.config/nvim"

# tmux
tmux_config_dir: "{{ ansible_env.HOME }}/.config/tmux"

# Herdr
herdr_config_dir: "{{ ansible_env.HOME }}/.config/herdr"

# Herdr agent integrations: hooks that report agent state back to Herdr.
# Full target list: herdr integration install --help
herdr_integrations:
  - claude
  - codex
  - opencode

# Zsh
zsh_config_dir: "{{ ansible_env.HOME }}/.config/zsh"

# Alacritty
alacritty_config_dir: "{{ ansible_env.HOME }}/.config/alacritty"

# Lazygit (OS-specific paths)
lazygit_config_dir_linux: "{{ ansible_env.HOME }}/.config/lazygit"
lazygit_config_dir_macos: "{{ ansible_env.HOME }}/Library/Application Support/lazygit"

# Font directories (OS-specific)
font_dir_linux: "{{ ansible_env.HOME }}/.local/share/fonts"
font_dir_macos: "{{ ansible_env.HOME }}/Library/Fonts"
font_dir: "{{ font_dir_macos if is_macos else font_dir_linux }}"

# Docker
docker_users:
  - "{{ ansible_user_id }}"

# Self-update: periodically pull this repo on the machine and apply the playbook.
# Set selfupdate_enabled: false (per host or with -e) to remove the schedule.
selfupdate_enabled: true
selfupdate_repo: "https://github.com/mvmaasakkers/workmachine.git"
selfupdate_branch: "main"
selfupdate_checkout_dir: "{{ ansible_env.HOME }}/.local/share/workmachine"
selfupdate_log: "{{ ansible_env.HOME }}/.local/state/workmachine/selfupdate.log"
selfupdate_log_max_bytes: 5242880 # 5 MiB, then rotated to .log.1
selfupdate_lock_dir: "{{ ansible_env.HOME }}/.local/state/workmachine/selfupdate.lock"
# Extra ansible-playbook arguments, e.g. "--skip-tags nvim"
selfupdate_extra_args: ""
selfupdate_timeout_sec: 3600

# Schedule. Keep the Linux and macOS values describing the same moment.
selfupdate_oncalendar: "Mon *-*-* 04:00:00" # systemd OnCalendar
selfupdate_randomized_delay_sec: 3600
selfupdate_macos_weekday: 1 # launchd: 0 and 7 are Sunday, 1 is Monday
selfupdate_macos_hour: 4
selfupdate_macos_minute: 0
selfupdate_launchd_label: "dev.workmachine.selfupdate"
selfupdate_launchd_plist: "{{ ansible_env.HOME }}/Library/LaunchAgents/dev.workmachine.selfupdate.plist"
