---
# Herdr role - Install Herdr, a terminal workspace manager / agent multiplexer
# https://github.com/ogulcancelik/herdr
#
# Distributed as a single static Rust binary per platform, so it is installed
# straight from the GitHub release into ~/.local/bin instead of via the
# curl | sh installer. That keeps the version pinned in vars.yml and lets
# `herdr update` self-update later without sudo. A self-update moves ahead of
# the pinned version; the next playbook run pins it back.

- name: Ensure ~/.local/bin exists for Herdr
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: '0755'

- name: Check current Herdr version
  ansible.builtin.shell: |
    export PATH="$HOME/.local/bin:$PATH"
    herdr --version
  args:
    executable: /bin/bash
  register: herdr_current_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set Herdr architecture mapping
  ansible.builtin.set_fact:
    herdr_arch_map:
      x86_64: "x86_64"
      amd64: "x86_64"
      aarch64: "aarch64"
      arm64: "aarch64" # macOS reports as 'arm64' for Apple Silicon

- name: Set Herdr release asset name
  ansible.builtin.set_fact:
    herdr_asset: "herdr-{{ 'macos' if ansible_os_family == 'Darwin' else 'linux' }}-{{ herdr_arch_map[ansible_architecture] | default('x86_64') }}"

- name: Install Herdr binary
  ansible.builtin.get_url:
    url: "https://github.com/ogulcancelik/herdr/releases/download/v{{ herdr_version }}/{{ herdr_asset }}"
    dest: "{{ ansible_env.HOME }}/.local/bin/herdr"
    mode: '0755'
    force: true
    timeout: 60
  when: herdr_current_version.rc | default(1) != 0 or ('herdr ' + herdr_version) not in herdr_current_version.stdout | default('')

# Configuration -------------------------------------------------------------
# The config directory also holds the server socket, so only the config file
# itself is managed here.

- name: Ensure Herdr config directory exists
  ansible.builtin.file:
    path: "{{ herdr_config_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Herdr config (Catppuccin Mocha, matching nvim and tmux)
  ansible.builtin.copy:
    src: config.toml
    dest: "{{ herdr_config_dir }}/config.toml"
    mode: '0644'
  notify: Reload Herdr server config

- name: Validate deployed Herdr config
  ansible.builtin.shell: |
    export PATH="$HOME/.local/bin:$PATH"
    herdr config check
  args:
    executable: /bin/bash
  register: herdr_config_check
  changed_when: false
  when: not ansible_check_mode

# zsh completions -----------------------------------------------------------
# Generated by the installed binary so completions always match the version in
# use. ~/.config/zsh/completions is added to fpath by roles/zsh/files/.zshrc.

- name: Ensure zsh completions directory exists for Herdr
  ansible.builtin.file:
    path: "{{ zsh_config_dir }}/completions"
    state: directory
    mode: '0755'

- name: Generate Herdr zsh completions
  ansible.builtin.shell: |
    export PATH="$HOME/.local/bin:$PATH"
    herdr completion zsh
  args:
    executable: /bin/bash
  register: herdr_completion
  changed_when: false
  check_mode: false

- name: Deploy Herdr zsh completions
  ansible.builtin.copy:
    content: "{{ herdr_completion.stdout }}\n"
    dest: "{{ zsh_config_dir }}/completions/_herdr"
    mode: '0644'
  when: herdr_completion.stdout | default('') | length > 0
  notify: Refresh zsh completion cache

# Agent integrations --------------------------------------------------------
# Hooks/plugins that report agent lifecycle state (working, blocked, done) back
# to Herdr, so the sidebar shows what each agent is doing. Installed into each
# agent's own config dir; `integration status` reports not installed / outdated
# / current per target.
#
# Herdr refuses to install into an agent config dir that does not exist yet
# (e.g. ~/.codex before codex has run once). That is treated as a skip, not a
# failure, and reported below.

- name: Check Herdr agent integration status
  ansible.builtin.shell: |
    export PATH="$HOME/.local/bin:$PATH"
    herdr integration status
  args:
    executable: /bin/bash
  register: herdr_integration_status
  changed_when: false
  check_mode: false

- name: Determine which Herdr agent integrations are already up to date
  ansible.builtin.set_fact:
    herdr_integrations_current: "{{ herdr_integration_status.stdout | default('') | regex_findall('(?m)^(\\w+): current') }}"

- name: Install Herdr agent integrations
  ansible.builtin.shell: |
    export PATH="$HOME/.local/bin:$PATH"
    herdr integration install {{ herdr_integration }}
  args:
    executable: /bin/bash
  register: herdr_integration_install
  loop: "{{ herdr_integrations }}"
  loop_control:
    loop_var: herdr_integration
  when:
    - not ansible_check_mode
    - herdr_integration not in herdr_integrations_current
  changed_when: herdr_integration_install.rc == 0
  failed_when:
    - herdr_integration_install.rc != 0
    - "'config directory not found' not in herdr_integration_install.stderr"

- name: Report Herdr agent integrations skipped because the agent is missing
  ansible.builtin.debug:
    msg: "Herdr integration skipped: {{ herdr_skipped_integration.stderr }}"
  loop: "{{ herdr_integration_install.results | default([]) | rejectattr('skipped', 'defined') | rejectattr('rc', 'eq', 0) | list }}"
  loop_control:
    loop_var: herdr_skipped_integration
    label: "{{ herdr_skipped_integration.herdr_integration }}"

# Agent skill ---------------------------------------------------------------
# Upstream SKILL.md, vendored from the pinned release tag, so Claude Code can
# drive Herdr over its socket API (spawn panes, read output, wait on agents).
# The skill refuses to act unless it runs inside a Herdr pane (HERDR_ENV=1).

- name: Ensure Claude Code skills directory exists for Herdr
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.claude/skills/herdr"
    state: directory
    mode: '0755'

- name: Deploy Herdr agent skill for Claude Code
  ansible.builtin.copy:
    src: SKILL.md
    dest: "{{ ansible_env.HOME }}/.claude/skills/herdr/SKILL.md"
    mode: '0644'

- name: Verify Herdr installation
  ansible.builtin.shell: |
    export PATH="$HOME/.local/bin:$PATH"
    herdr --version
  args:
    executable: /bin/bash
  register: herdr_version_output
  changed_when: false
  failed_when: false

- name: Display Herdr version and integrations
  ansible.builtin.debug:
    msg: |
      Herdr installed: {{ herdr_version_output.stdout }}
      Config: {{ herdr_config_dir }}/config.toml ({{ herdr_config_check.stdout | default('not checked') }})
      Integrations: {{ herdr_integrations | join(', ') }}
  when: not ansible_check_mode and herdr_version_output.stdout | default('') | length > 0
