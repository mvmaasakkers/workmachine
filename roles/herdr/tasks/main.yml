---
# Install Herdr (persistent runtime for coding agents) using the official installer
# Documentation: https://herdr.dev/docs/install/
# Always installs the latest release; Herdr is intentionally not version-pinned
# and can update itself afterwards via `herdr update`.
# Uses the same official installer on both macOS and Linux for consistency.

- name: Ensure ~/.local/bin exists for Herdr
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: '0755'

# Omarchy ships herdr as a pacman package (/usr/bin/herdr) and its own
# migrations actively delete a user-level copy: a stale ~/.local/bin/herdr can
# shadow the packaged client with an older wire protocol. Mirror that here.
- name: Remove user-level Herdr that would shadow the packaged client (Omarchy)
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin/herdr"
    state: absent
  when: is_omarchy

- name: Install Herdr via official installer
  ansible.builtin.shell: |
    curl -fsSL https://herdr.dev/install.sh | sh
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.local/bin/herdr"
  when: not is_omarchy and not ansible_check_mode

# Keybindings: use ctrl+space as the prefix on every machine, matching the
# Omarchy 4 default, so the muscle memory is the same everywhere. Only the
# prefix line is managed; other machine-local settings in config.toml survive.
- name: Ensure Herdr config directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/herdr"
    state: directory
    mode: '0755'

- name: Set Herdr prefix key to ctrl+space
  community.general.ini_file:
    path: "{{ ansible_env.HOME }}/.config/herdr/config.toml"
    section: keys
    option: prefix
    value: '"ctrl+space"'
    mode: '0644'
  register: herdr_prefix_result

- name: Reload Herdr server config if it is running
  ansible.builtin.shell: |
    export PATH="$HOME/.local/bin:$PATH"
    herdr server reload-config
  args:
    executable: /bin/bash
  when: herdr_prefix_result is changed and not ansible_check_mode
  failed_when: false
  changed_when: true

- name: Verify Herdr installation
  ansible.builtin.shell: |
    export PATH="$HOME/.local/bin:$PATH"
    herdr --version
  args:
    executable: /bin/bash
  register: herdr_version_output
  changed_when: false
  failed_when: false

- name: Display Herdr version
  ansible.builtin.debug:
    msg: "Herdr installed: {{ herdr_version_output.stdout }}"
  when: not ansible_check_mode and herdr_version_output.stdout | default('') | length > 0
