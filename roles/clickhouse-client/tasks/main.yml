---
# ClickHouse client role - Install clickhouse-client

- name: Check current clickhouse-client version
  ansible.builtin.command: clickhouse-client --version
  register: clickhouse_current_version
  changed_when: false
  failed_when: false

# macOS installation via Homebrew
- name: Install clickhouse-client (macOS)
  community.general.homebrew:
    name: clickhouse
    state: present
  when: ansible_os_family == "Darwin"

# Arch has no official ClickHouse package; install the official static
# multi-call binary and expose it under the clickhouse-client name.
- name: Install clickhouse-client (Arch)
  when:
    - is_arch
    - clickhouse_current_version.rc != 0
  become: true
  block:
    - name: Download and install ClickHouse static binary
      ansible.builtin.shell: |
        set -euo pipefail
        tmpdir=$(mktemp -d)
        cd "$tmpdir"
        curl -fsSL https://clickhouse.com/ | sh
        # The download is a self-extracting stub that decompresses itself in
        # place on first run. Trigger that here, while it is still in a
        # writable tmpdir, so the installed binary works for unprivileged
        # users (the stub cannot rewrite itself inside /usr/local/bin).
        ./clickhouse --version > /dev/null
        install -m 0755 clickhouse /usr/local/bin/clickhouse
        rm -rf "$tmpdir"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Symlink clickhouse-client to the multi-call binary
      ansible.builtin.file:
        src: /usr/local/bin/clickhouse
        dest: /usr/local/bin/clickhouse-client
        state: link

# Linux installation via official ClickHouse apt repository
- name: Install clickhouse-client (Linux)
  when:
    - ansible_os_family == "Debian"
    - clickhouse_current_version.rc != 0
  become: true
  block:
    - name: Install apt-transport-https and ca-certificates
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
        state: present

    - name: Add ClickHouse GPG key
      ansible.builtin.get_url:
        url: https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key
        dest: /usr/share/keyrings/clickhouse-keyring.asc
        mode: '0644'

    - name: Add ClickHouse apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/clickhouse-keyring.asc] https://packages.clickhouse.com/deb stable main"
        state: present
        filename: clickhouse

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install clickhouse-client package
      ansible.builtin.apt:
        name: clickhouse-client
        state: present

- name: Verify clickhouse-client installation (macOS)
  ansible.builtin.command: clickhouse client --version
  register: clickhouse_version_output
  changed_when: false
  when: ansible_os_family == "Darwin"

- name: Verify clickhouse-client installation (Linux)
  ansible.builtin.command: clickhouse-client --version
  register: clickhouse_version_output_linux
  changed_when: false
  when: ansible_os_family in ["Debian", "Archlinux"]

- name: Display clickhouse-client version (macOS)
  ansible.builtin.debug:
    msg: "clickhouse-client installed: {{ clickhouse_version_output.stdout_lines[0] }}"
  when: not ansible_check_mode and ansible_os_family == "Darwin" and clickhouse_version_output.stdout_lines | length > 0

- name: Display clickhouse-client version (Linux)
  ansible.builtin.debug:
    msg: "clickhouse-client installed: {{ clickhouse_version_output_linux.stdout_lines[0] }}"
  when: not ansible_check_mode and ansible_os_family in ["Debian", "Archlinux"] and clickhouse_version_output_linux.stdout_lines | length > 0
