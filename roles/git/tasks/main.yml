---
# Git role - Configure global gitignore, defaults and SSH commit signing
# User-specific settings (name, email) should be configured manually

- name: Ensure git config directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/git"
    state: directory
    mode: '0755'

- name: Deploy global gitignore
  ansible.builtin.copy:
    src: gitignore_global
    dest: "{{ ansible_env.HOME }}/.config/git/ignore"
    mode: '0644'

- name: Configure git to use global gitignore
  community.general.git_config:
    name: core.excludesFile
    value: "{{ ansible_env.HOME }}/.config/git/ignore"
    scope: global

- name: Configure git global defaults
  community.general.git_config:
    name: "{{ git_setting.name }}"
    value: "{{ git_setting.value }}"
    scope: global
  loop:
    - { name: "init.defaultBranch", value: "main" }
    - { name: "pull.rebase", value: "true" }
    - { name: "merge.conflictstyle", value: "zdiff3" }
    - { name: "diff.colorMoved", value: "default" }
    - { name: "core.pager", value: "delta" }
    - { name: "interactive.diffFilter", value: "delta --color-only" }
    - { name: "delta.navigate", value: "true" }
    - { name: "delta.line-numbers", value: "true" }
    - { name: "delta.dark", value: "true" }
  loop_control:
    loop_var: git_setting

- name: Remove conflicting delta.light setting
  community.general.git_config:
    name: delta.light
    scope: global
    state: absent

# Commit signing with a dedicated SSH key, kept separate from the
# authentication key so both can be rotated independently. The public key
# still needs to be added to GitHub manually as a signing key.
- name: Generate SSH signing keypair
  community.crypto.openssh_keypair:
    path: "{{ git_signing_key }}"
    type: ed25519
    comment: "git-signing-{{ ansible_hostname }}"
    mode: '0600'
  register: git_signing_keypair

- name: Configure SSH commit signing
  community.general.git_config:
    name: "{{ git_setting.name }}"
    value: "{{ git_setting.value }}"
    scope: global
  loop:
    - { name: "gpg.format", value: "ssh" }
    - { name: "user.signingKey", value: "{{ git_signing_key }}.pub" }
    - { name: "commit.gpgsign", value: "true" }
    - { name: "tag.gpgsign", value: "true" }
    - { name: "gpg.ssh.allowedSignersFile", value: "{{ ansible_env.HOME }}/.config/git/allowed_signers" }
  loop_control:
    loop_var: git_setting

- name: Read configured git user email
  ansible.builtin.command: git config --global user.email
  register: git_user_email
  changed_when: false
  failed_when: false

# Allows verification of your own signatures (git log --show-signature)
- name: Generate allowed_signers file
  ansible.builtin.copy:
    content: "{{ git_user_email.stdout }} {{ git_signing_keypair.public_key }}\n"
    dest: "{{ ansible_env.HOME }}/.config/git/allowed_signers"
    mode: '0644'
  when:
    - git_user_email.rc == 0
    - git_user_email.stdout | length > 0
