---
# Node.js role - Install Node.js via nvm (cross-platform)
# On Omarchy, Node.js is already managed by mise (seeded by the Omarchy
# installer), so the whole nvm path is skipped there and the global packages
# are installed through the mise-managed npm instead.

- name: Check if nvm is already installed
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.nvm/nvm.sh"
  register: nodejs_nvm_installed

- name: Install nvm
  ansible.builtin.shell: |
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh | bash
  args:
    creates: "{{ ansible_env.HOME }}/.nvm/nvm.sh"
  when: not is_omarchy and not nodejs_nvm_installed.stat.exists

- name: Ensure nvm is sourced in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - nvm"
    block: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
    create: true
    mode: '0644'
  when: not is_omarchy

- name: Remove prefix/globalconfig from .npmrc (incompatible with nvm)
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.npmrc"
    regexp: "^(prefix|globalconfig)="
    state: absent
  failed_when: false

- name: Install Node.js via nvm
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm install {{ nodejs_version }}
  args:
    executable: /bin/bash
  register: nodejs_nvm_install_result
  changed_when: "'is already installed' not in nodejs_nvm_install_result.stderr"
  when: not is_omarchy

- name: Set default Node.js version
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm alias default {{ nodejs_version }}
  args:
    executable: /bin/bash
  changed_when: false
  when: not is_omarchy

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: '0755'

- name: Create stable node/npm/npx symlinks in ~/.local/bin
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    . "$NVM_DIR/nvm.sh"
    NVM_BIN="$(dirname "$(nvm which default)")"
    for bin in node npm npx; do
      ln -sf "$NVM_BIN/$bin" "$HOME/.local/bin/$bin"
    done
  args:
    executable: /bin/bash
  changed_when: true
  when: not is_omarchy

- name: Get Node.js version
  ansible.builtin.shell: |
    if [ -s "$HOME/.nvm/nvm.sh" ]; then
      export NVM_DIR="$HOME/.nvm"
      . "$NVM_DIR/nvm.sh"
    elif command -v mise >/dev/null 2>&1 && mise which node >/dev/null 2>&1; then
      # Omarchy: route npm/node through the mise-managed installation; plain
      # PATH lookup here finds the root-owned pacman npm (/usr/lib) instead.
      # Pin the global prefix to the mise install so no session
      # npm_config_prefix (or other config source) can redirect it to /usr.
      npm() { env npm_config_prefix="$(mise where node)" NPM_CONFIG_PREFIX="$(mise where node)" mise x node -- npm "$@"; }
      node() { mise x node -- node "$@"; }
    fi
    node --version
  args:
    executable: /bin/bash
  register: nodejs_node_version_output
  changed_when: false

- name: Display Node.js version
  ansible.builtin.debug:
    msg: "Node.js installed: {{ nodejs_node_version_output.stdout }}"

- name: Get npm version
  ansible.builtin.shell: |
    if [ -s "$HOME/.nvm/nvm.sh" ]; then
      export NVM_DIR="$HOME/.nvm"
      . "$NVM_DIR/nvm.sh"
    elif command -v mise >/dev/null 2>&1 && mise which node >/dev/null 2>&1; then
      # Omarchy: route npm/node through the mise-managed installation; plain
      # PATH lookup here finds the root-owned pacman npm (/usr/lib) instead.
      # Pin the global prefix to the mise install so no session
      # npm_config_prefix (or other config source) can redirect it to /usr.
      npm() { env npm_config_prefix="$(mise where node)" NPM_CONFIG_PREFIX="$(mise where node)" mise x node -- npm "$@"; }
      node() { mise x node -- node "$@"; }
    fi
    npm --version
  args:
    executable: /bin/bash
  register: nodejs_npm_version_output
  changed_when: false

- name: Display npm version
  ansible.builtin.debug:
    msg: "npm installed: {{ nodejs_npm_version_output.stdout }}"

# On Omarchy the shells below route npm through `mise x node`, installing
# globals into the user-owned mise-managed Node prefix.
- name: Check installed global npm packages
  ansible.builtin.shell: |
    if [ -s "$HOME/.nvm/nvm.sh" ]; then
      export NVM_DIR="$HOME/.nvm"
      . "$NVM_DIR/nvm.sh"
    elif command -v mise >/dev/null 2>&1 && mise which node >/dev/null 2>&1; then
      # Omarchy: route npm/node through the mise-managed installation; plain
      # PATH lookup here finds the root-owned pacman npm (/usr/lib) instead.
      # Pin the global prefix to the mise install so no session
      # npm_config_prefix (or other config source) can redirect it to /usr.
      npm() { env npm_config_prefix="$(mise where node)" NPM_CONFIG_PREFIX="$(mise where node)" mise x node -- npm "$@"; }
      node() { mise x node -- node "$@"; }
    fi
    npm list -g --depth=0 --json 2>/dev/null || echo '{}'
  args:
    executable: /bin/bash
  register: nodejs_npm_global_list
  changed_when: false
  when: not ansible_check_mode

- name: Install common global npm packages
  ansible.builtin.shell: |
    if [ -s "$HOME/.nvm/nvm.sh" ]; then
      export NVM_DIR="$HOME/.nvm"
      . "$NVM_DIR/nvm.sh"
    elif command -v mise >/dev/null 2>&1 && mise which node >/dev/null 2>&1; then
      # Omarchy: route npm/node through the mise-managed installation; plain
      # PATH lookup here finds the root-owned pacman npm (/usr/lib) instead.
      # Pin the global prefix to the mise install so no session
      # npm_config_prefix (or other config source) can redirect it to /usr.
      npm() { env npm_config_prefix="$(mise where node)" NPM_CONFIG_PREFIX="$(mise where node)" mise x node -- npm "$@"; }
      node() { mise x node -- node "$@"; }
    fi
    npm install -g {{ nodejs_package }}
  args:
    executable: /bin/bash
  loop:
    - yarn
    - pnpm
    - typescript
    - typescript-language-server
    - ts-node
    - nodemon
    - neonctl
  loop_control:
    loop_var: nodejs_package
  register: nodejs_npm_install_result
  changed_when: "'added' in nodejs_npm_install_result.stdout"
  when: not ansible_check_mode and nodejs_package not in ((nodejs_npm_global_list.stdout | default('{}') | from_json).dependencies | default({})).keys()

# Regenerate the mise shims so freshly installed npm globals (yarn, pnpm, ...)
# resolve in every shell without an explicit `mise x`
- name: Refresh mise shims for global npm binaries (Omarchy)
  ansible.builtin.command: mise reshim
  changed_when: false
  when: is_omarchy and not ansible_check_mode

- name: Symlink global npm bins (yarn/pnpm/neonctl) into ~/.local/bin
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    . "$NVM_DIR/nvm.sh"
    NVM_BIN="$(dirname "$(nvm which default)")"
    for bin in yarn pnpm neonctl; do
      if [ -e "$NVM_BIN/$bin" ]; then
        ln -sf "$NVM_BIN/$bin" "$HOME/.local/bin/$bin"
      fi
    done
  args:
    executable: /bin/bash
  changed_when: true
  when: not is_omarchy

# Install Bun (cross-platform JavaScript runtime and toolkit)
- name: Check if Bun is already installed
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.bun/bin/bun"
  register: nodejs_bun_installed

- name: Install Bun
  ansible.builtin.shell: |
    curl -fsSL https://bun.sh/install | bash
  args:
    creates: "{{ ansible_env.HOME }}/.bun/bin/bun"
  environment:
    BUN_INSTALL: "{{ ansible_env.HOME }}/.bun"
  when: not nodejs_bun_installed.stat.exists

# On Omarchy the shell is bash and no ~/.zshrc exists; don't create a stray one
- name: Ensure Bun PATH in .zshrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'export PATH="$HOME/.bun/bin:$PATH"'
    state: present
    create: true
    mode: '0644'
  when: not is_omarchy

- name: Ensure Bun PATH in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: 'export PATH="$HOME/.bun/bin:$PATH"'
    state: present
    create: true
    mode: '0644'

- name: Get Bun version
  ansible.builtin.command: "{{ ansible_env.HOME }}/.bun/bin/bun --version"
  register: nodejs_bun_version_output
  changed_when: false
  failed_when: false

- name: Display Bun version
  ansible.builtin.debug:
    msg: "Bun installed: {{ nodejs_bun_version_output.stdout }}"
  when: nodejs_bun_version_output.rc == 0 and nodejs_bun_version_output.stdout | length > 0
