---
# Neovim role - Install Neovim with basic configuration

- name: Remove vim and vim-tiny (Linux)
  ansible.builtin.package:
    name:
      - vim
      - vim-tiny
    state: absent
  become: true
  when: ansible_os_family == "Debian"

# Distro/PPA packages lag behind (Debian 13 ships 0.10.x, LazyVim needs >= 0.11.2),
# so install pinned official release tarballs instead, like eza and lazygit.
- name: Remove Neovim PPA (Ubuntu/Pop!_OS)
  ansible.builtin.apt_repository:
    repo: ppa:neovim-ppa/unstable
    state: absent
  become: true
  when: ansible_distribution in ["Ubuntu", "Pop!_OS"]

- name: Remove distro Neovim package (Linux)
  ansible.builtin.package:
    name: neovim
    state: absent
  become: true
  when: ansible_os_family == "Debian"

- name: Set Neovim platform architecture (Linux)
  ansible.builtin.set_fact:
    nvim_arch: "{{ 'x86_64' if ansible_architecture == 'x86_64' else 'arm64' }}"
  when: ansible_os_family == "Debian"

- name: Check if Neovim is installed (Linux)
  ansible.builtin.stat:
    path: /opt/nvim/bin/nvim
  register: nvim_binary
  when: ansible_os_family == "Debian"

- name: Get installed Neovim version (Linux)
  ansible.builtin.command: /opt/nvim/bin/nvim --version
  register: nvim_installed_version
  changed_when: false
  failed_when: false
  when: ansible_os_family == "Debian" and nvim_binary.stat.exists

- name: Set Neovim needs installation flag (Linux)
  ansible.builtin.set_fact:
    nvim_needs_install: "{{ not nvim_binary.stat.exists or neovim_version not in (nvim_installed_version.stdout | default('')) }}"
  when: ansible_os_family == "Debian"

- name: Download Neovim (Linux)
  ansible.builtin.get_url:
    url: "https://github.com/neovim/neovim/releases/download/v{{ neovim_version }}/nvim-linux-{{ nvim_arch }}.tar.gz"
    dest: "/tmp/nvim_{{ neovim_version }}.tar.gz"
    mode: "0644"
    timeout: 30
  when: ansible_os_family == "Debian" and nvim_needs_install

- name: Remove previous Neovim install (Linux)
  ansible.builtin.file:
    path: /opt/nvim
    state: absent
  become: true
  when: ansible_os_family == "Debian" and nvim_needs_install

- name: Create Neovim install directory (Linux)
  ansible.builtin.file:
    path: /opt/nvim
    state: directory
    mode: "0755"
  become: true
  when: ansible_os_family == "Debian" and nvim_needs_install

- name: Extract Neovim (Linux)
  ansible.builtin.unarchive:
    src: "/tmp/nvim_{{ neovim_version }}.tar.gz"
    dest: /opt/nvim
    remote_src: true
    extra_opts:
      - --strip-components=1
  become: true
  when: ansible_os_family == "Debian" and nvim_needs_install

- name: Symlink nvim into /usr/local/bin (Linux)
  ansible.builtin.file:
    src: /opt/nvim/bin/nvim
    dest: /usr/local/bin/nvim
    state: link
  become: true
  when: ansible_os_family == "Debian"

- name: Clean up Neovim tarball (Linux)
  ansible.builtin.file:
    path: "/tmp/nvim_{{ neovim_version }}.tar.gz"
    state: absent
  when: ansible_os_family == "Debian" and nvim_needs_install

# Arch (and Omarchy, which preinstalls it) tracks the latest stable release
- name: Install Neovim (Arch)
  community.general.pacman:
    name: neovim
    state: present
  become: true
  when: is_arch

- name: Install Neovim (macOS)
  community.general.homebrew:
    name: neovim
    state: present
  when: ansible_os_family == "Darwin"

- name: Check if Neovim config is a git repo
  ansible.builtin.stat:
    path: "{{ neovim_config_dir }}/.git"
  register: nvim_config_git

- name: Remove Neovim config directory if it was a git clone
  ansible.builtin.file:
    path: "{{ neovim_config_dir }}"
    state: absent
  when: nvim_config_git.stat.exists

- name: Deploy Neovim configuration
  ansible.builtin.copy:
    src: files/
    dest: "{{ neovim_config_dir }}/"
    mode: preserve

# The colorscheme lives outside files/ so it can differ per platform: a fixed
# Catppuccin Mocha everywhere, except on Omarchy where the colorscheme comes
# from the active Omarchy theme (see the symlinks below) and a competing
# colorscheme spec would fight it.
- name: Deploy fixed Catppuccin colorscheme (non-Omarchy)
  ansible.builtin.template:
    src: colorscheme.lua
    dest: "{{ neovim_config_dir }}/lua/plugins/colorscheme.lua"
    mode: '0644'
  when: not is_omarchy

- name: Remove fixed colorscheme in favor of Omarchy theming (Omarchy)
  ansible.builtin.file:
    path: "{{ neovim_config_dir }}/lua/plugins/colorscheme.lua"
    state: absent
  when: is_omarchy

- name: Ensure plugin/after directory exists (Omarchy)
  ansible.builtin.file:
    path: "{{ neovim_config_dir }}/plugin/after"
    state: directory
    mode: '0755'
  when: is_omarchy

# Theme integration from the omarchy-nvim package: theme.lua points at the
# active theme's generated colorscheme spec, the /usr/share links track the
# package so `omarchy update` keeps them current, and the hotreload plugin
# reapplies colors live on `omarchy theme set`.
- name: Link Omarchy theme integration into the Neovim config (Omarchy)
  ansible.builtin.file:
    src: "{{ nvim_omarchy_link.src }}"
    dest: "{{ neovim_config_dir }}/{{ nvim_omarchy_link.dest }}"
    state: link
    force: true
  loop:
    - src: "{{ ansible_env.HOME }}/.local/state/omarchy/current/theme/neovim.lua"
      dest: lua/plugins/theme.lua
    - src: /usr/share/omarchy-nvim/config/lua/plugins/all-themes.lua
      dest: lua/plugins/all-themes.lua
    - src: /usr/share/omarchy-nvim/config/lua/plugins/omarchy-theme-hotreload.lua
      dest: lua/plugins/omarchy-theme-hotreload.lua
    - src: /usr/share/omarchy-nvim/config/plugin/after/transparency.lua
      dest: plugin/after/transparency.lua
  loop_control:
    loop_var: nvim_omarchy_link
  when: is_omarchy

# Leftovers from the omarchy-nvim /etc/skel seed that this role does not
# manage; the remaining plugin specs would otherwise keep loading alongside
# our own (e.g. our snacks.lua config).
- name: Remove unmanaged Omarchy skeleton files (Omarchy)
  ansible.builtin.file:
    path: "{{ neovim_config_dir }}/{{ nvim_omarchy_leftover }}"
    state: absent
  loop:
    - lua/plugins/disable-news-alert.lua
    - lua/plugins/snacks-animated-scrolling-off.lua
    - lua/config/remote_clipboard.lua
    - README.md
    - LICENSE
  loop_control:
    loop_var: nvim_omarchy_leftover
  when: is_omarchy

# timeout: a headless nvim waiting on an interactive prompt would otherwise hang forever
- name: Install lazy.nvim and plugins
  ansible.builtin.command: nvim --headless "+Lazy! sync" +qa
  register: nvim_plugin_install
  changed_when: nvim_plugin_install.rc == 0
  failed_when: false
  timeout: 900

- name: Set nvim as default editor system-wide (Linux)
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^EDITOR='
    line: 'EDITOR=nvim'
    state: present
  become: true
  when: ansible_os_family in ["Debian", "Archlinux"]

- name: Set nvim as default VISUAL editor system-wide (Linux)
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^VISUAL='
    line: 'VISUAL=nvim'
    state: present
  become: true
  when: ansible_os_family in ["Debian", "Archlinux"]

- name: Update alternatives for editor to nvim (Linux)
  community.general.alternatives:
    name: editor
    path: /usr/bin/nvim
  become: true
  failed_when: false
  when: ansible_os_family == "Debian"

- name: Update alternatives for vi to nvim (Linux)
  community.general.alternatives:
    name: vi
    path: /usr/bin/nvim
  become: true
  failed_when: false
  when: ansible_os_family == "Debian"
