# Alacritty Configuration
# Cross-platform config for Linux (Omarchy/Pop!_OS/Ubuntu) and macOS
#
# This config uses platform-specific imports for font sizes:
# - Linux: import linux.toml (font size 11)
# - macOS: import macos.toml (font size 13, option_as_alt)
#
# Fonts installed via workmachine Ansible:
# - Hack Nerd Font Mono (primary)
# - JetBrainsMono Nerd Font
# - FiraCode Nerd Font
# - MesloLGS Nerd Font

# =============================================================================
# PLATFORM-SPECIFIC IMPORTS
# =============================================================================
# Alacritty will only import files that exist, making this cross-platform safe.
# colors.toml is deployed per platform by Ansible: static Catppuccin Mocha on
# Debian/macOS, a symlink to the active Omarchy theme on Omarchy (so the
# terminal follows `omarchy theme set`). Later imports win, and this file
# deliberately defines no colors of its own.

[general]
import = [
    "~/.config/alacritty/linux.toml",
    "~/.config/alacritty/macos.toml",
    "~/.config/alacritty/colors.toml",
]

# =============================================================================
# FONT CONFIGURATION
# =============================================================================
# Using Hack Nerd Font Mono for proper powerline/icon support.
# Font size is set in platform-specific files; this is the fallback.

[font]
size = 12.0

[font.normal]
family = "Hack Nerd Font Mono"
style = "Regular"

[font.bold]
family = "Hack Nerd Font Mono"
style = "Bold"

[font.italic]
family = "Hack Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font Mono"
style = "Bold Italic"

# =============================================================================
# WINDOW CONFIGURATION
# =============================================================================

[window]
# Padding adds breathing room around terminal content
padding = { x = 8, y = 8 }

# macOS only: Treat Option key as Alt for terminal navigation (Option+Arrow = word jump)
# Values: "OnlyLeft" | "OnlyRight" | "Both" | "None" (default)
option_as_alt = "Both"

# Window opacity (1.0 = fully opaque)
opacity = 1.0

# Window decorations: "Full" | "None" | "Transparent" | "Buttonless"
decorations = "Full"

# Startup mode: "Windowed" | "Maximized" | "Fullscreen"
startup_mode = "Windowed"

# Dynamic title based on running program
dynamic_title = true

# =============================================================================
# CURSOR CONFIGURATION
# =============================================================================

[cursor]
# Cursor style: "Block" | "Underline" | "Beam"
style = { shape = "Block", blinking = "Off" }

# Hollow cursor when window is unfocused
unfocused_hollow = true

# =============================================================================
# SCROLLING
# =============================================================================

[scrolling]
# Maximum lines in scrollback buffer
history = 10000

# Scroll multiplier (lines per scroll event)
multiplier = 3

# =============================================================================
# SELECTION
# =============================================================================

[selection]
# Characters considered part of a word for double-click selection
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# Copy selected text to clipboard automatically
save_to_clipboard = true

# =============================================================================
# TERMINAL SETTINGS
# =============================================================================

[terminal]
# OSC 52 clipboard handling
osc52 = "CopyPaste"

# =============================================================================
# COLORS
# =============================================================================
# Colors intentionally live in the imported colors.toml (see the import list
# above) so the Omarchy theme system can drive them on Omarchy machines.

# =============================================================================
# KEYBOARD SHORTCUTS
# =============================================================================
# Common shortcuts that work well across platforms.
# Platform-specific shortcuts can be added in linux.toml / macos.toml.

[[keyboard.bindings]]
# Clear scrollback and screen (Ctrl+Shift+K)
key = "K"
mods = "Control|Shift"
action = "ClearHistory"

[[keyboard.bindings]]
# Search backward (Ctrl+Shift+F)
key = "F"
mods = "Control|Shift"
action = "SearchForward"

# macOS Option+Arrow word navigation
[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001bb"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001bf"

# Send Shift+Return as CSI-u so TUIs (Claude Code, Codex) can distinguish it
# from plain Return. Same for Alt+Shift+Return, so tmux can match M-S-Enter.
# Adopted from the Omarchy default Alacritty config.
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"

[[keyboard.bindings]]
key = "Return"
mods = "Alt|Shift"
chars = "\u001b[13;4u"
