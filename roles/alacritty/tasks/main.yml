---
# Alacritty role - Install Alacritty terminal emulator

- name: Install Alacritty dependencies (Linux)
  ansible.builtin.package:
    name:
      - cmake
      - pkg-config
      - libfreetype6-dev
      - libfontconfig1-dev
      - libxcb-xfixes0-dev
      - libxkbcommon-dev
      - python3
    state: present
  become: true
  when: ansible_distribution in ["Ubuntu", "Debian", "Pop!_OS"]

- name: Add Alacritty PPA (Ubuntu/Pop!_OS)
  ansible.builtin.apt_repository:
    repo: ppa:aslatter/ppa
    state: present
  become: true
  when: ansible_distribution in ["Ubuntu", "Pop!_OS"]

- name: Update apt cache (Linux)
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: ansible_distribution in ["Ubuntu", "Pop!_OS"]

- name: Install Alacritty (Linux)
  ansible.builtin.package:
    name:
      - alacritty
    state: present
  become: true
  when: ansible_os_family == "Debian"

# Preinstalled on Omarchy; a plain Arch host gets it from the official repos
- name: Install Alacritty (Arch)
  community.general.pacman:
    name: alacritty
    state: present
  become: true
  when: is_arch

- name: Check if Alacritty is already installed (macOS)
  ansible.builtin.stat:
    path: /Applications/Alacritty.app
  register: alacritty_app_stat
  when: ansible_os_family == "Darwin"

- name: Install Alacritty (macOS)
  community.general.homebrew_cask:
    name: alacritty
    state: present
  when: ansible_os_family == "Darwin" and not alacritty_app_stat.stat.exists

- name: Check if Alacritty config is a git repo
  ansible.builtin.stat:
    path: "{{ alacritty_config_dir }}/.git"
  register: alacritty_config_git

- name: Remove Alacritty config directory if it was a git clone
  ansible.builtin.file:
    path: "{{ alacritty_config_dir }}"
    state: absent
  when: alacritty_config_git.stat.exists

- name: Deploy Alacritty configuration
  ansible.builtin.copy:
    src: files/
    dest: "{{ alacritty_config_dir }}/"
    mode: preserve

# alacritty.toml imports colors.toml; which colors land there is per platform.
# follow: false so a copy never writes through a leftover Omarchy theme symlink.
- name: Deploy static Catppuccin colors (non-Omarchy)
  ansible.builtin.copy:
    src: files/colors-catppuccin.toml
    dest: "{{ alacritty_config_dir }}/colors.toml"
    mode: '0644'
    follow: false
  when: not is_omarchy

- name: Link colors.toml to the active Omarchy theme (Omarchy)
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.local/state/omarchy/current/theme/alacritty.toml"
    dest: "{{ alacritty_config_dir }}/colors.toml"
    state: link
    force: true
  when: is_omarchy

- name: Verify Alacritty installation
  ansible.builtin.shell: |
    if command -v alacritty &>/dev/null; then
      alacritty --version
    elif [ -d "/Applications/Alacritty.app" ]; then
      echo "Alacritty.app installed (CLI not in PATH)"
    else
      exit 1
    fi
  register: alacritty_version
  changed_when: false

- name: Display Alacritty version
  ansible.builtin.debug:
    msg: "Alacritty installed: {{ alacritty_version.stdout }}"
