---
# Read-only replica of the private Obsidian Vault backup on ws-linux-01.

- name: Ensure Obsidian Vault parent directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Documents"
    state: directory
    mode: '0755'

- name: Clone or update the Obsidian Vault replica
  ansible.builtin.git:
    repo: git@github.com:mvmaasakkers/obsidian-vault.git
    dest: "{{ ansible_env.HOME }}/Documents/Obsidian Vault"
    version: main
    update: true
    accept_hostkey: true

- name: Disable pushes from the Vault replica
  community.general.git_config:
    repo: "{{ ansible_env.HOME }}/Documents/Obsidian Vault"
    scope: local
    name: remote.origin.pushurl
    value: no_push://read-only-replica
  when: not ansible_check_mode

- name: Ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: '0755'

- name: Install the Vault replica sync script
  ansible.builtin.copy:
    src: sync-obsidian-vault
    dest: "{{ ansible_env.HOME }}/.local/bin/sync-obsidian-vault"
    mode: '0755'

- name: Ensure user systemd directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user"
    state: directory
    mode: '0700'

- name: Install the Vault replica systemd service
  ansible.builtin.copy:
    src: obsidian-vault-sync.service
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/obsidian-vault-sync.service"
    mode: '0644'
  register: obsidian_vault_service_unit

- name: Install the Vault replica systemd timer
  ansible.builtin.copy:
    src: obsidian-vault-sync.timer
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/obsidian-vault-sync.timer"
    mode: '0644'
  register: obsidian_vault_timer_unit

- name: Reload user systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  when:
    - not ansible_check_mode
    - obsidian_vault_service_unit.changed or obsidian_vault_timer_unit.changed

- name: Enable and start the Vault replica timer
  ansible.builtin.systemd_service:
    name: obsidian-vault-sync.timer
    enabled: true
    state: started
    scope: user
  when: not ansible_check_mode

- name: Synchronise the Vault replica now
  ansible.builtin.systemd_service:
    name: obsidian-vault-sync.service
    state: started
    scope: user
  changed_when: false
  when: not ansible_check_mode
