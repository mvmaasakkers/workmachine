---
# PHP role - Install PHP and Composer

- name: Install PHP (macOS)
  community.general.homebrew:
    name: "php@{{ php_version }}"
    state: present
  when: ansible_os_family == "Darwin"

- name: Install Composer (macOS)
  community.general.homebrew:
    name: composer
    state: present
  when: ansible_os_family == "Darwin"

- name: Add Ondrej PHP PPA (Ubuntu/Pop!_OS)
  ansible.builtin.apt_repository:
    repo: ppa:ondrej/php
    state: present
  become: true
  when: ansible_distribution in ["Ubuntu", "Pop!_OS"]

# Debian's own repos only carry one PHP version per release (trixie: 8.4),
# so pinned versions come from Sury's repo — the Debian counterpart of the Ondrej PPA.
- name: Create /etc/apt/keyrings directory (Debian)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  when: ansible_distribution == "Debian"

# Key vendored from Sury's official debsuryorg-archive-keyring.deb; a copy beats
# downloading at run time, which can silently store a bad file that breaks apt verification
- name: Deploy Sury PHP signing key (Debian)
  ansible.builtin.copy:
    src: files/sury-php.gpg
    dest: /etc/apt/keyrings/sury-php.gpg
    mode: '0644'
  become: true
  when: ansible_distribution == "Debian"

- name: Add Sury PHP apt repository (Debian)
  ansible.builtin.deb822_repository:
    name: sury-php
    types: [deb]
    uris: ['https://packages.sury.org/php/']
    suites: ['{{ ansible_distribution_release }}']
    components: [main]
    signed_by: /etc/apt/keyrings/sury-php.gpg
    state: present
  become: true
  when: ansible_distribution == "Debian"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: ansible_os_family == "Debian"

- name: Check pinned PHP CLI package availability (Linux)
  ansible.builtin.command: "apt-cache show php{{ php_version }}-cli"
  register: php_cli_package_check
  changed_when: false
  failed_when: false
  when: ansible_os_family == "Debian"

- name: Ensure pinned PHP version is available in apt repositories
  ansible.builtin.assert:
    that:
      - php_cli_package_check.rc == 0
    fail_msg: "php{{ php_version }} packages are not available for {{ ansible_distribution }} {{ ansible_distribution_version }}. Adjust `php_version` in vars.yml or use a release where the packages exist."
    success_msg: "php{{ php_version }} packages are available in the configured apt repositories."
  when: ansible_os_family == "Debian"

- name: Install PHP and common extensions (Linux)
  ansible.builtin.package:
    name:
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-common"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-xml"
      - "php{{ php_version }}-zip"
      - "php{{ php_version }}-bcmath"
      - "php{{ php_version }}-intl"
      - "php{{ php_version }}-ctype"
      - "php{{ php_version }}-gd"
      - "php{{ php_version }}-iconv"
      - "php{{ php_version }}-amqp"
      - "php{{ php_version }}-pgsql"
      - "php{{ php_version }}-readline"
      - "php{{ php_version }}-soap"
      - "php{{ php_version }}-sqlite3"
      - "php{{ php_version }}-gmp"
      - "php{{ php_version }}-dev"
      - "php{{ php_version }}-redis"
      - "php-pear"
    state: present
  become: true
  when: ansible_os_family == "Debian"

# Arch is a rolling release and carries a single current PHP (matching the
# pin as long as vars.yml tracks the latest stable). Most extensions ship
# inside the main php package as disabled shared modules; the split packages
# below add the rest. The amqp extension has no official Arch package — grab
# AUR php-amqp manually if a project needs it.
- name: Install PHP, Composer and Symfony CLI (Arch)
  community.general.pacman:
    name:
      - php
      - php-gd
      - php-pgsql
      - php-sqlite
      - php-redis
      - composer
      - symfony-cli
    state: present
  become: true
  when: is_arch

# Shared modules are shipped disabled on Arch. Build the enable list from what
# is actually available as a module and not already compiled in, so the
# generated ini never double-loads an extension (which would warn on every run).
- name: Determine PHP extensions to enable (Arch)
  ansible.builtin.shell: |
    set -o pipefail
    builtin_modules=$(php -n -m | tr '[:upper:]' '[:lower:]')
    for ext in bcmath curl gd gmp iconv intl mbstring pdo_pgsql pgsql pdo_sqlite sqlite3 soap sodium redis zip; do
      if ! printf '%s\n' "$builtin_modules" | grep -qx "$ext" && [ -f "/usr/lib/php/modules/$ext.so" ]; then
        echo "extension=$ext"
      fi
    done
  args:
    executable: /bin/bash
  register: php_arch_extensions
  changed_when: false
  when: is_arch and not ansible_check_mode

- name: Enable PHP extensions (Arch)
  ansible.builtin.copy:
    content: |
      ; Managed by workmachine ansible - extensions used by our projects
      {{ php_arch_extensions.stdout }}
    dest: /etc/php/conf.d/workmachine.ini
    mode: '0644'
  become: true
  when: is_arch and not ansible_check_mode

- name: Check if Composer is installed
  ansible.builtin.stat:
    path: /usr/local/bin/composer
  register: php_composer_stat

# On Arch composer comes from pacman (/usr/bin/composer), so skip the installer
- name: Download Composer installer
  ansible.builtin.get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-installer.php
    checksum: "sha384:https://composer.github.io/installer.sig"
    mode: '0644'
    timeout: 30
  when: not is_arch and not php_composer_stat.stat.exists

- name: Install Composer
  ansible.builtin.command: >
    php /tmp/composer-installer.php --install-dir=/usr/local/bin --filename=composer --{{ composer_version }}
  args:
    creates: /usr/local/bin/composer
  become: true
  when: not is_arch and not php_composer_stat.stat.exists

- name: Check if Composer was actually installed
  ansible.builtin.stat:
    path: /usr/local/bin/composer
  register: php_composer_installed

- name: Set Composer executable permissions
  ansible.builtin.file:
    path: /usr/local/bin/composer
    mode: '0755'
  become: "{{ ansible_os_family == 'Debian' }}"
  when: php_composer_installed.stat.exists and (php_composer_installed.stat.mode is not defined or php_composer_installed.stat.mode != '0755')

- name: Verify PHP installation
  ansible.builtin.command: php --version
  register: php_version_output
  changed_when: false

- name: Display PHP version
  ansible.builtin.debug:
    msg: "PHP installed: {{ php_version_output.stdout_lines[0] }}"
  when: not ansible_check_mode and php_version_output.stdout_lines | length > 0

- name: Verify Composer installation
  ansible.builtin.command: composer --version
  register: php_composer_version_output
  changed_when: false

- name: Display Composer version
  ansible.builtin.debug:
    msg: "Composer installed: {{ php_composer_version_output.stdout_lines[0] }}"
  when: not ansible_check_mode and php_composer_version_output.stdout_lines | length > 0

- name: Check if Symfony CLI is installed
  ansible.builtin.stat:
    path: /usr/bin/symfony
  register: php_symfony_cli_stat

- name: Set up Symfony CLI repository
  ansible.builtin.shell: >
    curl -1sLf 'https://dl.cloudsmith.io/public/symfony/stable/setup.deb.sh' |
    {{ 'distro=ubuntu' if ansible_distribution == 'Pop!_OS' else '' }} bash
  args:
    creates: /etc/apt/sources.list.d/symfony-stable.list
  become: true
  when: ansible_os_family == "Debian" and not php_symfony_cli_stat.stat.exists

- name: Install Symfony CLI (Linux)
  ansible.builtin.apt:
    name: symfony-cli
    state: present
    update_cache: true
  become: true
  when: ansible_os_family == "Debian"

- name: Tap Symfony CLI repository (macOS)
  community.general.homebrew_tap:
    name: symfony-cli/tap
    state: present
  when: ansible_os_family == "Darwin"

- name: Check Symfony CLI tap trust status (macOS)
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/brew tap-info symfony-cli/tap"
  register: php_symfony_tap_info
  changed_when: false
  when: ansible_os_family == "Darwin"

- name: Trust Symfony CLI tap (macOS)
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/brew trust --tap symfony-cli/tap"
  when:
    - ansible_os_family == "Darwin"
    - "'Untrusted' in php_symfony_tap_info.stdout"

- name: Install Symfony CLI (macOS)
  community.general.homebrew:
    name: symfony-cli
    state: present
  when: ansible_os_family == "Darwin"

- name: Verify Symfony CLI installation
  ansible.builtin.command: symfony version
  register: php_symfony_version_output
  changed_when: false
  failed_when: false

- name: Display Symfony CLI version
  ansible.builtin.debug:
    msg: "Symfony CLI installed: {{ php_symfony_version_output.stdout_lines[0] }}"
  when: not ansible_check_mode and php_symfony_version_output.rc == 0 and php_symfony_version_output.stdout_lines | length > 0
